<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161b22">
  <title>CIVITAS — 시민의 시대</title>
  <style>
    :root{color-scheme:dark;--night:#161b22;--night2:#202832;--paper:#f0e8d7;--paper2:#e6dcc7;--ink:#242a2c;--muted:#87918e;--line:#ffffff1b;--gold:#e2bd72;--rust:#d27451;--teal:#7cb9ac;--blue:#8ca9d2;--serif:Georgia,"Noto Serif KR",serif;--sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:#f5f1e7;font:14px/1.5 var(--sans)}body{background:radial-gradient(ellipse at 50% -30%,#344147 0%,var(--night) 62%);min-height:100dvh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.app{max-width:1440px;min-height:100dvh;margin:auto;padding:0 28px 40px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:18px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #ddbd7570;border-radius:50%;color:var(--gold);font:20px var(--serif)}.brand small,.eyebrow{display:block;color:#b6a781;font-size:10px;font-weight:650;letter-spacing:.2em;text-transform:uppercase}.brand strong{display:block;font:500 20px var(--serif);letter-spacing:.02em}.top-meta{display:flex;align-items:center;gap:24px;color:#c3c8c0;font-size:12px}.top-meta b{color:#fff1d1;font:500 15px var(--serif)}.save-pill{border:1px solid var(--line);border-radius:99px;padding:6px 11px;color:#a8b9ae}.save-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#85b69a}.layout{display:grid;grid-template-columns:220px minmax(320px,1fr) 330px;gap:18px;padding-top:22px;align-items:start}.sidebar,.rightbar{position:sticky;top:20px}.identity{padding:17px;background:linear-gradient(145deg,#27343a,#202830);border:1px solid var(--line);border-radius:16px}.portrait{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;border:1px solid #dfbd7580;background:#3c4542;color:var(--gold);font:24px var(--serif);box-shadow:inset 0 0 0 5px #fff1}.identity h2{margin:12px 0 1px;font:500 19px var(--serif)}.identity p{margin:0;color:#a8b3ad;font-size:12px}.rank{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 9px;border:1px solid #d2745160;border-radius:99px;color:#e9a183;font-size:11px}.nav{display:grid;gap:5px;margin-top:16px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;color:#aeb9b5}.nav button .ico{width:21px;color:#bba66f;text-align:center}.nav button.active{background:#ffffff0b;border-color:var(--line);color:#fff1d1}.nav button:hover{background:#ffffff0a}.side-quote{margin:18px 6px;color:#9da8a4;font:italic 13px/1.6 var(--serif)}main{min-width:0}.chapter-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 14px}.chapter-head h1{margin:3px 0 0;font:500 clamp(23px,3vw,33px)/1.12 var(--serif);letter-spacing:-.03em}.chapter-meta{color:#97a49f;font-size:11px;text-align:right}.scene{position:relative;overflow:hidden;border:1px solid #ffffff1c;border-radius:17px;background:#293338;box-shadow:0 18px 46px #0004}.scene-top{position:absolute;z-index:2;left:15px;top:13px;display:flex;gap:6px}.scene-top span{padding:4px 8px;border:1px solid #ffffff25;border-radius:99px;background:#12191acc;color:#dfd4b8;font-size:10px;backdrop-filter:blur(8px)}.city-map{display:block;width:100%;height:auto;min-height:190px;max-height:310px;background:#64776b}.map-label{font:11px var(--sans);fill:#f5eedc;paint-order:stroke;stroke:#273832;stroke-width:3px;stroke-linejoin:round}.district-shape{cursor:pointer;transition:filter .2s,opacity .2s}.district-shape:hover{filter:brightness(1.17)}.district-shape.selected{filter:drop-shadow(0 0 6px #f8d889)}.scene-caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;background:#1f292a;border-top:1px solid #ffffff12;color:#b7c1b9;font-size:11px}.scene-caption strong{color:#eee0bd;font-weight:600}.event-card{margin-top:14px;padding:20px;border:1px solid #e2bd7240;border-radius:16px;background:linear-gradient(145deg,#252c30,#1e252b)}.event-kicker{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.15em}.event-kicker span:last-child{color:#aab4ae;font-weight:500;letter-spacing:.02em}.event-card h2{margin:10px 0 7px;font:500 clamp(22px,3vw,29px)/1.25 var(--serif);letter-spacing:-.02em}.event-card>p{max-width:62ch;margin:0;color:#b8c1bb;font-size:13px;line-height:1.7}.choice-list{display:grid;gap:8px;margin-top:17px}.choice{display:grid;grid-template-columns:33px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff06;text-align:left;transition:transform .15s,border-color .15s,background .15s}.choice:hover{transform:translateY(-1px);border-color:#e2bd7270;background:#e2bd720b}.choice-number{width:28px;height:28px;display:grid;place-items:center;border:1px solid #ffffff20;border-radius:50%;color:#cdb578;font:13px var(--serif)}.choice strong{display:block;font-size:13px;font-weight:650}.choice small{display:block;margin-top:3px;color:#9da9a3;font-size:11px;line-height:1.4}.effect{max-width:95px;color:#b4c8ba;font-size:10px;text-align:right}.meters{display:grid;gap:10px;margin-top:16px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff05}.meter-head{display:flex;justify-content:space-between;gap:10px;color:#c8d0c9;font-size:11px}.meter-head b{color:#f0d796;font-weight:600}.meter-track{height:4px;margin-top:5px;border-radius:10px;background:#ffffff16;overflow:hidden}.meter-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#b96f4e,#e1c075);transition:width .35s}.panel{padding:16px;border:1px solid var(--line);border-radius:15px;background:#202830}.panel+.panel{margin-top:12px}.panel h3{margin:0 0 12px;color:#f0e5c8;font:500 17px var(--serif)}.faction{display:grid;grid-template-columns:24px minmax(0,1fr) 38px;gap:8px;align-items:center;margin:11px 0}.faction-icon{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:#ffffff0a;color:#d3bf85;font-size:12px}.faction-name{font-size:11px;color:#c9d0c9}.faction-name small{display:block;margin-top:2px;color:#87948e;font-size:9px}.faction-score{color:#e9d396;font:13px var(--serif);text-align:right}.mini-track{height:3px;margin-top:4px;border-radius:4px;background:#ffffff18}.mini-track i{display:block;height:100%;border-radius:4px;background:var(--teal);transition:width .3s}.route{display:flex;gap:8px;align-items:center;margin:10px 0;padding:10px;border:1px solid #ffffff12;border-radius:10px;background:#ffffff04}.route-glyph{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#ffffff0b;color:var(--gold);font:15px var(--serif)}.route-copy{min-width:0;flex:1}.route-copy b{display:block;font-size:11px}.route-copy small{display:block;margin-top:2px;color:#99a59f;font-size:10px}.route-state{color:#9ba89f;font-size:9px;text-align:right}.route.active{border-color:#e2bd7250;background:#e2bd7209}.route.active .route-state{color:var(--gold)}.people-grid{display:grid;gap:9px}.person-card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#ffffff05}.person-face{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#655a4a,#333c39);color:#f1d99b;font:17px var(--serif)}.person-card b{display:block;font-size:12px}.person-card small{display:block;margin-top:2px;color:#9ba7a0;font-size:10px}.relation{color:#dfc782;font-size:10px}.log-list{display:grid;gap:0;margin:0;padding:0;list-style:none}.log-list li{display:grid;grid-template-columns:42px 1fr;gap:9px;padding:10px 0;border-top:1px solid var(--line);color:#c5cec6;font-size:12px}.log-list time{color:#c4a964;font-size:10px}.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.goal-card{min-height:150px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#ffffff05;text-align:left}.goal-card.active{border-color:#e2bd7280;background:#e2bd720b}.goal-card .goal-icon{font:23px var(--serif);color:var(--gold)}.goal-card b{display:block;margin:8px 0 4px;font-size:12px}.goal-card small{color:#9da9a3;font-size:10px;line-height:1.5}.result{padding:24px;border:1px solid #e2bd7270;border-radius:16px;background:linear-gradient(145deg,#2b3335,#202830)}.result-mark{font:42px var(--serif);color:var(--gold)}.result h2{margin:7px 0;font:500 27px var(--serif)}.result p{color:#b8c1bb;line-height:1.7}.result .primary{margin-top:13px;padding:11px 15px;border:0;border-radius:10px;background:var(--gold);color:#202226;font-weight:700}.toast{position:fixed;z-index:20;left:50%;bottom:26px;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:10px 14px;border:1px solid #ffffff26;border-radius:99px;background:#202830;color:#fff0c9;font-size:12px;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.mobile-nav{display:none}
    @media(max-width:1100px){.app{padding:0 18px 35px}.layout{grid-template-columns:190px minmax(0,1fr)}.rightbar{position:static;grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}.rightbar .panel+.panel{margin:0}.rightbar .panel:first-child{grid-row:span 2}}
    @media(max-width:760px){.app{padding:0 13px calc(88px + env(safe-area-inset-bottom))}.topbar{height:65px}.brand-mark{width:29px;height:29px;font-size:17px}.brand strong{font-size:17px}.brand small{font-size:8px}.top-meta{gap:10px;font-size:10px}.top-meta b{font-size:12px}.save-pill{padding:5px 7px;font-size:9px}.layout{display:block;padding-top:14px}.sidebar{position:static;margin-bottom:12px}.identity{display:flex;align-items:center;gap:10px;padding:9px 11px}.portrait{width:36px;height:36px;font-size:17px}.identity h2{margin:0;font-size:14px}.identity p{font-size:10px}.identity-info{flex:1}.rank{margin:0;font-size:9px}.nav,.side-quote{display:none}.chapter-head{margin-bottom:10px}.chapter-head h1{font-size:24px}.chapter-meta{font-size:9px}.city-map{min-height:160px}.event-card{padding:16px;margin-top:11px}.event-card h2{font-size:23px}.event-card>p{font-size:12px}.choice{grid-template-columns:29px minmax(0,1fr);gap:8px;padding:11px}.choice-number{width:26px;height:26px}.effect{grid-column:2;max-width:none;text-align:left;margin-top:-3px}.rightbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.rightbar .panel{padding:12px}.rightbar .panel:first-child{grid-row:auto}.rightbar .panel+.panel{margin:0}.rightbar .panel h3{font-size:15px;margin-bottom:8px}.faction{grid-template-columns:21px minmax(0,1fr) 28px;gap:6px;margin:9px 0}.faction-name{font-size:10px}.faction-name small{font-size:8px}.route{padding:8px;gap:6px}.route-glyph{width:24px;height:24px;font-size:13px}.route-copy b{font-size:10px}.route-copy small{font-size:9px}.route-state{font-size:8px}.mobile-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #ffffff20;background:#171e25f2;backdrop-filter:blur(16px)}.mobile-nav button{display:grid;justify-items:center;gap:3px;flex:1;padding:3px 1px;border:0;background:transparent;color:#9eaaa4;font-size:9px}.mobile-nav button i{font-style:normal;font-size:16px}.mobile-nav button.active{color:#f0d796}.goal-grid{grid-template-columns:1fr}.goal-card{min-height:0}.toast{bottom:calc(76px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">C</span><div><small>CIVITAS · A LIVING POLITY</small><strong>시민의 시대</strong></div></div>
      <div class="top-meta"><span><b id="season">봄 · 1년</b><br>새벽 6시</span><span class="save-pill"><i class="save-dot"></i><span id="saveState">기록 중</span></span></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <section class="identity"><div class="portrait" id="portrait">민</div><div class="identity-info"><h2 id="playerName">민서</h2><p id="playerSub">시장 골목 · 평민</p></div><span class="rank" id="rank">● 평민</span></section>
        <nav class="nav" aria-label="게임 화면">
          <button data-tab="city" class="active"><span class="ico">⌂</span>도시</button>
          <button data-tab="people"><span class="ico">♧</span>인물과 세력</button>
          <button data-tab="ambition"><span class="ico">◇</span>나의 야망</button>
          <button data-tab="chronicle"><span class="ico">▤</span>연대기</button>
        </nav>
        <p class="side-quote">“권력은 왕관에서 시작되지 않는다. 누구의 편에 섰는지에서 시작된다.”</p>
      </aside>
      <main id="screen" aria-live="polite"></main>
      <aside class="rightbar" id="rightbar"></aside>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="게임 화면">
    <button data-tab="city" class="active"><i>⌂</i>도시</button>
    <button data-tab="people"><i>♧</i>인물</button>
    <button data-tab="ambition"><i>◇</i>야망</button>
    <button data-tab="chronicle"><i>▤</i>연대기</button>
  </nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="/game.js" defer></script>
</body>
</html>
